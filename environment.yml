name: gnn
channels:
  - conda-forge
  - bioconda
  - salilab
dependencies:
  - python=3.10
  - pandas
  - numpy
  - scikit-learn
  - tqdm
  - biopython
  - cd-hit
  - salilab::dssp
  - libboost=1.73
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch
      - torch_geometric
      - fair-esm
      - transformers
variables:
  PYTHONNOUSERSITE: "1"
